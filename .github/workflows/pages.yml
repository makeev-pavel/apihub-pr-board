name: Publish board

# The page holds no data: viewers load it with their own token (DATA-3), so there is nothing to refresh on a schedule.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Never cancel a deploy that is already running; a newer run waits for it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # No step needs the job token, so it is not left in the git config either (SEC-5).
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests with the coverage gate
        run: npm run test:coverage

      - name: Check that every requirement has a test
        run: npm run test:requirements

  # Browser tests on the mock server. The screenshot project stays local: its baselines are Windows-only.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # No step needs the job token, so it is not left in the git config either (SEC-5).
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Downloads Chromium unless the cache has it, and installs its system libraries either way.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # A failed test blocks the deploy.
  build:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # No step needs the job token, so it is not left in the git config either (SEC-5).
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Only the page: no prs.json and no repositories. The link names them (FILTER-14).
      - name: Build page
        run: npx vite build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
