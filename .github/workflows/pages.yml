name: Publish board

on:
  schedule:
    # Hourly, 06:00-17:00 UTC, Monday to Friday.
    - cron: '0 6-17 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Never cancel a deploy that is already running; a newer run waits for it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Scheduled runs only refresh the data of code that was tested when it was pushed, so they skip both test jobs.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests with the coverage gate
        run: npm run test:coverage

      - name: Check that every requirement has a test
        run: npm run test:requirements

  # Browser tests on the mock server. The screenshot project stays local: its baselines are Windows-only.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Downloads Chromium unless the cache has it, and installs its system libraries either way.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    needs: [test, e2e]
    # Runs when both test jobs passed, or were skipped on a schedule; a failed or cancelled test blocks the deploy.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The target repositories are a repository variable (owner/name, comma-separated), so the code never names them.
      - name: Build page
        env:
          PR_BOARD_REPO: ${{ vars.PR_BOARD_REPO }}
        run: npx vite build

      # Only this step sees the token.
      - name: Fetch pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BOARD_REPO: ${{ vars.PR_BOARD_REPO }}
        run: node scripts/build-site.ts _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
